name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # pipefail обязателен: gradle пишется в tee, и без него шаг всегда «зелёный».
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже есть в образе ubuntu-latest, лицензии приняты —
      # недостающие platform/build-tools AGP докачает сам.
      - name: Inspect Android SDK
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version 2>&1
            ls "$ANDROID_HOME" || true
            echo "-- platforms --"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
            echo "-- build-tools --"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          } 2>&1 | tee sdk-info.txt
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -n "$SM" ]; then yes | "$SM" --licenses > /dev/null 2>&1 || true; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Gradle Wrapper (gradlew, gradle-wrapper.jar) — бинарный, поэтому в git
      # не лежит. Генерируем на месте: после этого сборка идёт через ./gradlew,
      # а артефакт gradle-wrapper можно распаковать в локальный клон.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee wrapper.log

      - name: Show signing key
        run: |
          if [ -f keystore/release.p12 ]; then
            echo "keystore present: $(wc -c < keystore/release.p12) bytes"
            keytool -list -v -keystore keystore/release.p12 -storetype PKCS12 \
              -storepass zapret-android 2>&1 | grep -E "Alias|Entry type|Valid|SHA256:|Owner" | head -12
          else
            echo "::warning::keystore/release.p12 missing — release falls back to the debug key"
          fi

      - name: Build release APK (signed, minified)
        id: release
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build-release.log

      - name: Build debug APK
        id: debug
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build-debug.log

      # Логи сессии скачать извне бывает нельзя, поэтому ошибки компиляции
      # дублируются аннотациями checks API — они читаются через api.github.com.
      - name: Surface build errors as annotations
        if: steps.release.outcome == 'failure' || steps.debug.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, re
          def tail(path, limit=160):
              if not os.path.exists(path):
                  return None
              txt = open(path, encoding='utf-8', errors='replace').read()
              pat = re.compile(r'^e: |^w: .*deprecat|error: |FAILURE: |What went wrong|'
                                r'^> Task .* FAILED|Execution failed|Caused by: |\* Where:|\* Try:|'
                                r'^\s+at org\.gradle|Compilation error|Unresolved reference|'
                                r'not enough information|type mismatch|overload resolution', re.I)
              keep = [l for l in txt.splitlines() if pat.search(l)]
              body = "\n".join(keep[:limit]) if keep else txt[-8000:]
              return body[-24000:]
          for label, path in (("release", "build-release.log"), ("debug", "build-debug.log")):
              body = tail(path)
              if body is None:
                  continue
              esc = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print("::error title=%s build failed::%s" % (label, esc))
          PY
          exit 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            sdk-info.txt
            wrapper.log
            build-release.log
            build-debug.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report signing
        if: steps.release.outcome == 'success'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            ls -l "$f"
            "$BT/apksigner" verify --print-certs "$f" 2>&1 | head -20 || true
          done

      - name: Collect artifacts
        if: steps.release.outcome == 'success'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ZapretForAndroid-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk     out/ZapretForAndroid-debug.apk
          zip -q -r out/gradle-wrapper.zip gradlew gradlew.bat gradle/wrapper || true
          ls -l out

      - name: Upload APKs
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zapret-apk
          path: |
            out/ZapretForAndroid-release.apk
            out/ZapretForAndroid-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle wrapper
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: out/gradle-wrapper.zip
          if-no-files-found: warn
          retention-days: 30
