name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Gradle Wrapper (gradlew, gradle-wrapper.jar) — бинарный, поэтому в git
      # не лежит. Генерируем на месте: после этого шага сборка идёт через ./gradlew,
      # а артефакт wrapper.zip можно распаковать в локальный клон, чтобы больше
      # не зависеть от установленного в системе Gradle.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Show signing key
        run: |
          if [ -f keystore/release.p12 ]; then
            echo "keystore present: $(wc -c < keystore/release.p12) bytes"
          else
            echo "::warning::keystore/release.p12 missing — release will fall back to the debug key"
          fi

      - name: Build release APK (signed, minified)
        run: ./gradlew --no-daemon --stacktrace --warning-mode=all assembleRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Report signing
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            echo "=== $f ==="
            ls -l "$f"
            "$BT/apksigner" verify --print-certs "$f" 2>&1 | head -20 || true
          done

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ZapretForAndroid-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk     out/ZapretForAndroid-debug.apk
          zip -q -r out/gradle-wrapper.zip gradlew gradlew.bat gradle/wrapper || true
          ls -l out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zapret-apk
          path: |
            out/ZapretForAndroid-release.apk
            out/ZapretForAndroid-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: out/gradle-wrapper.zip
          if-no-files-found: warn
          retention-days: 30
