name: Release

# Релиз по тегу: v1.0.0, 1.0.0 или v1.0.0-beta1 — без разницы, тег
# используется как есть. Подписанный APK появляется на странице Releases
# и в реестре пакетов репозитория, а не живёт 30 дней в артефактах Actions.
on:
  push:
    tags:
      - 'v[0-9]+.*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для релиза (например v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  checks: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK → GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      # Подпись берётся из того же зафиксированного ключа, что и в обычной
      # сборке, поэтому APK ставится поверх предыдущего без удаления
      # приложения и без потери настроек.
      - name: Build release APK
        run: |
          # Лог пишется в файл и дублируется в stdout: причина падения должна
          # быть видна в логе задачи, а не только в артефакте.
          #
          # Блок ошибок отделён от конвейера намеренно: глобальный
          # `bash -eo pipefail` иначе оборвал бы шаг на первом же
          # непустом совпадении grep, не дав напечатать причину.
          if ! ./gradlew --no-daemon --max-workers=2 --stacktrace assembleRelease \
               > build-release.log 2>&1; then
            cat build-release.log
            echo "=== сборка релиза упала, причины: ==="
            grep -E '^e: |error:|^> Task .*FAILED|Execution failed' build-release.log || true
            exit 1
          fi
          tail -n 30 build-release.log

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK не собран"; exit 1; }
          "$BT/apksigner" verify "$APK" || { echo "::error::подпись невалидна"; exit 1; }
          echo "::notice title=APK::подпись валидна"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "zapret-$TAG.apk"
          notes="$(mktemp)"
          {
            echo "Подписанный APK Zapret для Android."
            echo
            echo "- minSdk 24 (Android 7.0), targetSdk 35"
            echo "- обход DPI-блокировок без root, на собственном TCP/IP-стеке"
            echo "- подпись тем же ключом, что и у предыдущих сборок — обновление ставится поверх"
            echo
            echo "Сборка: \`$GITHUB_SHA\`"
          } > "$notes"
          # Пересоздание тега приводило к падению всего шага: релиз с таким
          # тегом уже существовал, `gh release create` отказывался, и
          # публикация обрывалась. Теперь существующий релиз обновляется,
          # а существующий файл заменяется — повторный прогон идемпотентен.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Релиз $TAG уже существует — обновляем его"
            gh release upload "$TAG" "zapret-$TAG.apk" --clobber
            gh release edit "$TAG" --title "Zapret $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "zapret-$TAG.apk" \
              --title "Zapret $TAG" \
              --notes-file "$notes" \
              --generate-notes
          fi
          echo "::notice title=Релиз::$TAG опубликован: $(gh release view "$TAG" --json url -q .url)"