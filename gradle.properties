org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Kotlin-демон живёт между шагами CI и накапливает память — ограничиваем его,
# иначе раннер убивает процессы сборщика (см. ретраи в workflow).
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
