# Параметры подписи релизной сборки.
#
# ВНИМАНИЕ: этот ключ (keystore/release.p12) лежит в публичном репозитории.
# Он нужен только для того, чтобы у всех — у вас, у CI и у будущих сборок —
# была ОДНА И ТА ЖЕ подпись: тогда APK ставится поверх предыдущего без
# удаления и без потери данных.
#
# Для публикации в Google Play этот ключ НЕ годится: сгенерируйте свой
# (Android Studio > Build > Generate Signed Bundle / APK) и либо замените
# keystore/release.p12, либо перекройте значения переменными окружения /
# флагами -P (они имеют приоритет над этим файлом):
#
#   ./gradlew assembleRelease \
#     -PZAPRET_STORE_FILE=/path/to/my.p12 \
#     -PZAPRET_STORE_PASSWORD=... \
#     -PZAPRET_KEY_ALIAS=... \
#     -PZAPRET_KEY_PASSWORD=...
#
# Приоритет источника: -P / gradle.properties  >  переменная окружения  >  этот файл.

ZAPRET_STORE_FILE=keystore/release.p12
ZAPRET_STORE_PASSWORD=zapret-android
ZAPRET_KEY_ALIAS=zapret
ZAPRET_KEY_PASSWORD=zapret-android
